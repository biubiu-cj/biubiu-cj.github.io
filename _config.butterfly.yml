# --------------------------------------
# 浅夏 Blog - Butterfly Theme Anime Configuration
# --------------------------------------

# Navigation
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  友链: /links/ || fas fa-link

# Code Blocks
code_blocks:
  theme: pale night
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# Social
social:
  fab fa-github: https://github.com/biubiu-cj || Github || '#24292e'

# Images
favicon: /img/favicon.png
avatar:
  img: /img/avatar.jpg
  effect: true

disable_top_img: false
default_top_img: /img/bg.jpg
index_img: /img/bg.jpg

# Footer background
footer_img: false

# Website Background (don't set — use CSS on body instead to avoid overlap)
background:

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/bg.jpg

error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

error_404:
  enable: true
  subtitle: '页面没有找到...但樱花还在飘呢~'
  background: /img/error-page.png

# Friend Links (友链)
flink:
  style: butterfly
  random: true
  title: 小伙伴们
  list:
    # - name: 示例博客
    #   link: https://example.com
    #   avatar: https://example.com/avatar.jpg
    #   descr: 这是一个很棒的博客

# Post Meta
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# Homepage
index_site_info_top: 45%
index_top_img_height: 420px

# Subtitle with Stray Birds quotes (泰戈尔《飞鸟集》)
subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - 如果你因失去了太阳而流泪，那么你也将失去群星了
    - 世界对着它的爱人，把它浩瀚的面具揭下了
    - 生如夏花之绚烂，死如秋叶之静美
    - 不要因为你自己没有胃口而去责备你的食物
    - 我们把世界看错了，反说它欺骗我们
    - 你微微地笑着，不同我说什么话。而我觉得，为了这个，我已等待得久了
    - 鸟儿愿为一朵云，云儿愿为一只鸟
    - 根是地下的枝，枝是空中的根
    - 我不能选择那最好的，是那最好的选择我
    - 我的存在，对我是一个永久的神奇，这就是生活
    - 小草呀，你的足步虽小，但是你拥有你足下的土地
    - 静静地坐着吧，我的心，不要扬起你的尘土。让世界自己寻路向你走来
    - 生命从世界得到资产，爱情使它得到价值
    - 当我们大为谦卑的时候，便是我们最接近伟大的时候
    - 谢谢火焰给你光明，但是不要忘了那执灯的人

# Article layout
index_layout: 1
index_post_content:
  method: 2
  length: 300

# Post Settings
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/biubiu-cj
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

post_pagination: 1

# Footer
footer:
  owner:
    enable: true
    since: 2025
  copyright:
    enable: true
    version: true
  custom_text: 浅夏的博客 - 记录学习与生活的点点滴滴

# Aside
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 好きなことを続ける
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/biubiu-cj
  card_announcement:
    enable: true
    content: 🌙 欢迎来到浅夏的小窝~ <br> 星空の下で
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# Bottom right buttons
rightside_bottom:

# Dark Mode
darkmode:
  enable: true
  button: true
  autoChangeMode: false

readmode: true
rightside_scroll_percent: true
rightside_config_animation: true

# Copy
copy:
  enable: true
  copyright:
    enable: true
    limit_count: 150

# Busuanzi
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# --------------------------------------
# Theme Colors - Cinematic Starry Night Blue
# --------------------------------------
theme_color:
  enable: true
  main: "#6a8cc4"
  paginator: "#7a9cd4"
  button_hover: "#5a7cb4"
  text_selection: "#7a9cd4"
  link_color: "#6a8cc4"
  meta_color: "#8899aa"
  hr_color: "#7a9cd4"
  code_foreground: "#6a8cc4"
  code_background: "rgba(27, 31, 45, 0.06)"
  toc_color: "#6a8cc4"
  blockquote_padding_color: "#7a9cd4"
  blockquote_background_color: "#8aacd4"
  scrollbar_color: "#7a9cd4"
  meta_theme_color_light: "#1e2545"
  meta_theme_color_dark: "#0d0f1a"

# --------------------------------------
# UI Effects
# --------------------------------------
rounded_corners_ui: true
text_align_justify: false

mask:
  header: true
  footer: true

# Loading Animation
preloader:
  enable: true
  source: 1

# Page Transition
enter_transitions: true

# Default display mode
display_mode: light

# Typewriter Effect (activate-power-mode)
activate_power_mode:
  enable: true
  colorful: true
  shake: true
  mobile: true

# Background Effects
canvas_ribbon:
  enable: false
  size: 150
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

canvas_fluttering_ribbon:
  enable: false
  mobile: false

canvas_nest:
  enable: false
  color: '255,133,162'
  opacity: 0.5
  zIndex: -1
  count: 99
  mobile: false

# Mouse Click Effects
fireworks:
  enable: true
  zIndex: 9999
  mobile: true

click_heart:
  enable: true
  mobile: true

clickShowText:
  enable: true
  text:
    - 桜
    - 好き
    - 頑張って
    - 夢
    - 星
    - 浅夏
  fontSize: 16px
  random: true
  mobile: true

# Divider icon (sakura flower)
hr_icon:
  enable: true
  icon: '\f004'
  icon_top:

# --------------------------------------
# Search
# --------------------------------------
search:
  use: local_search
  placeholder: 搜索文章...

# --------------------------------------
# Font Settings
# --------------------------------------
font:
  global_font_size: 16px
  code_font_size: 14px

blog_title_font:
  font_link: https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap
  font_family: 'ZCOOL XiaoWei, "Microsoft YaHei", sans-serif'

# --------------------------------------
# Other
# --------------------------------------
instantpage: true

# Inject custom CSS and JS
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
    - <link rel="preconnect" href="https://fonts.googleapis.com">
    - <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    - <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  bottom:
    - <script src="/js/stardust.js"></script>
    - <script src="/js/sakura.js"></script>
    - <script src="https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
    - <script src="/js/live2d-config.js"></script>

# --------------------------------------
# Comments (Giscus)
# --------------------------------------
comments:
  use: Giscus
  text: true
  lazyload: true
  count: true
  card_post_count: true

giscus:
  repo: biubiu-cj/biubiu-cj.github.io
  repo_id: R_kgDOS2rD9g
  category_id: DIC_kwDOS2rD9s4C-8ag
  category: Announcements
  light_theme: light
  dark_theme: dark_dimmed
  lang: zh-CN
  mapping: pathname
  reactions_enabled: 1
  input_position: bottom

# --------------------------------------
# CDN
# --------------------------------------
CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
